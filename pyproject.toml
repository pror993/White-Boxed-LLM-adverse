[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "white-boxed-llm-adverse"
version = "0.1.0"
description = "First-Order Discrete Optimization and Adversarial Robustness in Autoregressive Language Models"
authors = [{ name = "Rishit", email = "research@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "discrete-optimization",
    "adversarial-robustness",
    "language-models",
    "coordinate-gradient",
    "gcg",
    "apple-silicon-mps"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --durations=10"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
